<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="diprolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Tech Hexagon Shield -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" stroke="url(#diprolGrad)" stroke-width="3" fill="#0A192F" fill-opacity="0.95" />
  
  <!-- Molecular Nodes & Bonds -->
  <line x1="32" y1="14" x2="48" y2="24" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.7" />
  <line x1="48" y1="24" x2="48" y2="40" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.7" />
  <line x1="48" y1="40" x2="32" y2="50" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.7" />
  <line x1="32" y1="50" x2="16" y2="40" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.7" />
  <line x1="16" y1="40" x2="16" y2="24" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.7" />
  <line x1="16" y1="24" x2="32" y2="14" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.7" />
  
  <!-- Central Pure Droplet -->
  <path d="M32 20 C32 20, 23 33, 23 40 C23 45.52 27.03 49 32 49 C36.97 49 41 45.52 41 40 C41 33 32 20 32 20 Z" fill="url(#dropGrad)" filter="url(#glow)" />
  
  <!-- Sparkle Accent (Energy/Efficiency) -->
  <circle cx="48" cy="24" r="3.5" fill="#F97316" />
  <circle cx="16" cy="40" r="3" fill="#38BDF8" />
  <circle cx="32" cy="14" r="3" fill="#06B6D4" />
  <circle cx="29" cy="38" r="1.5" fill="#FFFFFF" opacity="0.9" />
</svg>
